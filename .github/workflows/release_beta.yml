name: Build and release Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta Version (e.g. 1.4.0-beta1)'
        required: true
        default: '1.3.9-beta'

permissions:
  contents: write

jobs:
  release-beta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Beta applications
        run: |
          pyinstaller --noconfirm macro_bootstrap_beta.spec
          pyinstaller --noconfirm launcher_beta.spec

      - name: Create portable Python runtime
        shell: pwsh
        run: |
          $pythonVersion = "3.12.10"
          $runtime = "portable-runtime"
          Invoke-WebRequest "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip $runtime
          New-Item -ItemType Directory -Force "$runtime\Lib\site-packages" | Out-Null
          @(
            "python312.zip"
            "."
            "Lib/site-packages"
            "import site"
          ) | Set-Content "$runtime\python312._pth" -Encoding ascii
          python -m pip install --target "$runtime\Lib\site-packages" PySide6 certifi keyboard numpy opencv-python pywin32 aiohttp

      - name: Create Beta package and manifest
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          New-Item -ItemType Directory -Force beta-package | Out-Null
          Copy-Item dist\FiveM-Farming-Beta-Macro.exe beta-package\
          Copy-Item config.json beta-package\
          Copy-Item templates beta-package\templates -Recurse
          New-Item -ItemType Directory -Force beta-package\templates\_app | Out-Null
          Copy-Item gui_macro.py beta-package\templates\_app\
          Copy-Item keyauth_helper.py beta-package\templates\_app\
          Copy-Item discord_remote.py beta-package\templates\_app\
          Copy-Item portable-runtime beta-package\templates\_runtime -Recurse
          Compress-Archive -Path beta-package\* -DestinationPath dist\FiveM-Farming-Beta-Package.zip -Force
          $betaHash = (Get-FileHash dist\FiveM-Farming-Beta-Package.zip -Algorithm SHA256).Hash.ToLower()
          @{
            version = $version
            package = "FiveM-Farming-Beta-Package.zip"
            package_sha256 = $betaHash
          } | ConvertTo-Json | Set-Content dist\beta-manifest.json -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Beta Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: FiveM Farming Beta v${{ steps.package.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/FiveM-Farming-Beta-Launcher.exe
            dist/FiveM-Farming-Beta-Package.zip
            dist/beta-manifest.json
